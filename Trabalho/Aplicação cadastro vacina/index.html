<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicação de Cadastro de Vacinas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Aplicação de Cadastro de Vacinas</h1>
    <main>
        <form id="cad-paciente">
            <h2>Cadastro do paciente</h2>
            <label>Nome do paciente:</label>
            <input type="text" id="name" placeholder="Ex: João">
            <label>CPF:</label>
            <input type="number" id="cpf" placeholder="Ex: 000000-00">
            <label>Data de nascimento:</label>
            <input type="date" id="data-nasc">
            <label>Selecione o tipo da vacina:</label>
            <input type="" id="Tipo da vacina">
            <label>Data de Vacinação:</label>
            <input type="date" id="data-vacina">
            <div class="buttons">
                <button type="submit">Enviar</button>
                <button type="reset">Cancelar</button>
            </div>
        </form>
        <form id="inf-pacientes">
            <h2>Informações do paciente</h2>

        </form>
    </main>
    <script src="script.js"></script>
</body>
</html>
