<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 28.09</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-color: #d6d6d6;
        } 
        header {
            width: 100%;
            height: 50px;
            background-color: #0000005d;
            border-bottom: 1px solid #000;
        }
        nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 100px;
            width: 100%;
        }
        li {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 50px;
        }
        a {
            text-decoration: none;
            color: #000000;
            font-weight: bold;
        }
        #cadastro {
            margin-top: 40px;
            width: 400px;
            height: 80vh;
        }  
        #cadastro-form {
            width: 400px;
            height: 680px;
            background-color: #534c36;
            text-align: start;
            display: flex;
            flex-direction: column;
            border-radius: 15px;
            margin-top: 10px;
            border: 1px solid #000000;
            filter: drop-shadow(1px 1px 5px #000000);
        }
        h1 {
            text-align: center;
            margin-bottom: 15px;
            font-weight: 500;
            font-size: 30px;
            font-family: fantasy;
            color: #000000;
            filter: drop-shadow(1px 1px 1px #00e1ff);
        }
        label {
            margin-left: 40px;
            font-weight: 500;
            font-size: 19px;
            font-family: fantasy;
            color: #000000;
            filter: drop-shadow(1px 1px 1px #00e1ff);
        }
        input {
            margin-left: 40px;
            border-radius: 5px;
            border: 1px solid #333;
            width: 80%;
            height: 35px;
        }
        #consultar {
            padding-top: 150px;
            width: 400px;
            height: 100vh;
        }
        #cons-vagas {
            width: 400px;
            height: 600px;
            background-color: #534c36;
            text-align: start;
            display: flex;
            flex-direction: column;
            border-radius: 15px;
            border: 1px solid #000000;
            filter: drop-shadow(1px 1px 5px #000000);
        }
        h1 {
            text-align: center;
            margin-top: 30px;
            font-weight: 500;
            font-size: 30px;
            font-family: fantasy;
            color: #000000;
            filter: drop-shadow(1px 1px 1px #00e1ff);
        }
        .divider {
            width: 100%;
            border-top: 2px solid #534c36;
        }
        .buttons {
            width: 100%;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
        }
        .send, .cancel {
            width: 120px;
            height: 40px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .send {
            border: 2px solid #020202;
        }
        .cancel {
            background-color: #ff5656;
            border: 2px solid #000000;
        }
        #vagas-list {
            font-size: 17px;
            font-weight: bold;
            color: #fdfdfd;
            display: flex;
            flex-direction: column;
            gap: 30px;
            width: 95%;
            margin: 5px auto;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <li><a href="#cadastro">Cadastro</a></li>
            <li><a href="#consultar">Consultar</a></li>
        </nav>
    </header>
    <section id="cadastro">
        <form id="cadastro-form">
            <h1>Cadastramento de Vagas</h1>
            <label>Placa</label>
            <input type="text" id="placa" placeholder="&nbsp Ex: ABC-123" maxlength="6" required><br>
            <label>Proprietário</label>
            <input type="text" id="proprietario" placeholder="&nbsp Ex: João" required><br>
            <label>Apartamento</label>
            <input type="number" id="apartamento" placeholder="&nbsp Ex: 123" required><br>
            <label>Bloco</label>
            <input type="text" id="bloco" placeholder="&nbsp Ex: A" maxlength="1" required><br>
            <label>Modelo</label>
            <input type="text" id="modelo" placeholder="&nbsp Ex: BMW" required><br>
            <label>Cor</label>
            <input type="text" id="cor" placeholder="&nbsp Ex: Preto" required><br>
            <label>Quantidade de vagas</label>
            <input type="number" id="qntVagas" placeholder="&nbsp Ex: 1" required><br>
            <div class="buttons">
                <button class="send" type="submit">Enviar</button>
                <button class="cancel" type="reset">Cancelar</button>
            </div>
        </form>
    </section>

    <div class="divider"></div>
    
    <section id="consultar">
        <form id="cons-vagas">
            <h1>Consulta de Vagas</h1>
            <ul id="vagas-list"></ul>
        </form>
    </section>

    <script src="script.js"></script>
</body>
</html>
